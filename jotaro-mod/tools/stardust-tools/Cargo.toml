[package]
name = "stardust-tools"
version = "0.1.0"
edition = "2021"
description = "Stardust Storm build helpers: string finder, magic identification, profile build and manifests"

[[bin]]
name = "stardust"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
